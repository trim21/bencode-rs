[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "bencode-rs"
version = "0.1.0"
requires-python = ">=3.11"
description = "a bencode parser build with pyo3"
readme = "readme.md"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Rust",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
]
keywords = ["bittorrent", "bencode", "p2p"]

[project.urls]
Homepage = 'https://github.com/trim21/bencode-rs'

[dependency-groups]
dev = [
  "abi3audit==0.0.26",
  "maturin==1.16.0",
  "pytest==9.2.0",
  "pytest-codspeed==5.0.4",
  "pytest-github-actions-annotate-failures==0.4.2",
  "twine==7.0.0",
]

[tool.maturin]
module-name = "bencode_rs._bencode"
python-source = "py"

[tool.ruff]
target-version = 'py311'
line-length = 88

src = ['py', 'tests']

[tool.ruff.lint]
extend-select = ['UP', 'I', 'E', 'W', 'FA', 'ANN']
ignore = ['ANN401', 'E721', 'E501']

[tool.ruff.lint.per-file-ignores]
"tests/**" = ['ANN']

[tool.uv]
package = false
