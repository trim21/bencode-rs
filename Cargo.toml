[package]
name = "bencode"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "bencode"
crate-type = ["cdylib"]

[features]
default = []

[dependencies]
bytes = "1.12.1"
num = "0.4.3"
# we need PyBuffer which is stable since 3.11
pyo3 = { version = "0.30.1", features = ['generate-import-lib', 'abi3-py311'] }
smallvec = "1.16.5"
