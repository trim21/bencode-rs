name: autofix.ci

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  cargo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: trim21/setup-rust@v0.0.2

      - run: cargo fmt || true
      - run: cargo clippy --fix --allow-dirty || true
      # incomplete hook fixes are committed by autofix-ci/action below, the strict run lives in ci.yaml
      - uses: trim21/actions/prek@master
        continue-on-error: true

      - uses: autofix-ci/action@v1
